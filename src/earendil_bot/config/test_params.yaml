# Configuration file
# This file can be read by test nodes during launch.

test_nodes:
  ros__parameters:
    heading_tolerance_rad: 0.15      # radians (approx 8.5 degrees)
    heading_tolerance_deg: 8.5       # degrees
    arrival_radius: 2.0              # meters
    turn_speed: 0.25                  # rad/s
    drive_speed: 0.5                 # m/s
    steer_kp: 0.3                    # Proportional steering coefficient
