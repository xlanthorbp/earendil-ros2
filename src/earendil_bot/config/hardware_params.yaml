# hardware_params.yaml
# Hardware configurations for Earendil Bot

# Arduino Configuration
hardware_bridge:
  ros__parameters:
    # Serial Port Settings
    port: "/dev/ttyACMx"
    baudrate: 115200
    ir_height: 1.0                # meters (Height of the IR sensor from the ground)

    # Kinematics (For Odometry)
    wheel_radius: 0.15            # meters (Taken from URDF: wheel_link_radius = 0.15)
    wheel_separation: 0.7         # meters (Taken from URDF: body_link_y_dim (0.6) + wheel_link_length (0.1) = 0.7)
    ticks_per_rev: 341.2          # Encoder ticks per 1 full wheel revolution (Adjust for your specific motor gear ratio)
    
    # Magnetometer (Yaw Offset)
    heading_offset: 0.0           # degrees (Used to align magnetic north with robot's forward direction if needed)

    # Motor PWM Limits
    min_pwm: 60
    max_pwm: 90
    use_gpstest_commands: true

# RTK GPS Node Configuration
roverRTK:
  ros__parameters:
    gps_port: "/dev/ttyUSBx"
    radio_port: "/dev/ttyUSBx"
    gps_baud: 460800
    radio_baud: 57600
    configure_rover: true
    min_pwm: 60
    max_pwm: 90
    target_pwm: 80
    cmd_vel_topic: "/cmd_vel"
    target_lat: 0.0
    target_lon: 0.0

# 2D Lidar Node Configuration
STL27L:
  ros__parameters:
    port_name: "/dev/ttyUSBx"
    port_baudrate: 921600

# Aruco Ethernet Receiver Configuration
aruco_receiver:
  ros__parameters:
    jetson_ip: "192.168.1.101"
    port_recv: 5005
    port_send: 5006
    timeout: 1.5

# Rock Ethernet Receiver Configuration
rock_receiver:
  ros__parameters:
    jetson_ip: "192.168.1.101"
    port_recv: 5007
    port_send: 5008
    timeout: 1.5